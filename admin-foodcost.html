<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>RistoHub — Admin Food Cost</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 16px; background: #fafafa; color: #222; }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; margin-top: 40px; border-bottom: 2px solid #1a1a1a; padding-bottom: 6px; }
  section { margin-bottom: 40px; }
  form { display: grid; gap: 8px; margin-bottom: 20px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }
  form.recipe-form { grid-template-columns: 2fr 2fr 1fr auto; }
  label { font-size: 12px; color: #666; display: block; margin-bottom: 2px; }
  input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { padding: 9px 14px; border: none; border-radius: 6px; background: #1a1a1a; color: white; cursor: pointer; height: 38px; }
  button.danger { background: #b3261e; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
  th { background: #f0f0f0; }
  .cost-good { color: #1a7a1a; font-weight: bold; }
  .cost-warn { color: #b3821e; font-weight: bold; }
  .cost-bad { color: #b3261e; font-weight: bold; }
  #status { margin: 10px 0; font-size: 13px; color: #555; }
</style>
</head>
<body>

<h1>RistoHub — Food Cost Admin</h1>
<div id="status"></div>

<section>
  <h2>Ingredienti</h2>
  <form id="ingredient-form">
    <div><label>Nome</label><input type="text" id="ing-name" required></div>
    <div><label>Unità (g, kg, ml, pz)</label><input type="text" id="ing-unit" required></div>
    <div><label>Costo per unità (€)</label><input type="number" id="ing-cost" step="0.0001" min="0" required></div>
    <div><label>Fornitore</label><input type="text" id="ing-supplier"></div>
    <button type="submit">Aggiungi</button>
  </form>
  <table>
    <thead><tr><th>Nome</th><th>Unità</th><th>Costo/unità</th><th>Fornitore</th></tr></thead>
    <tbody id="ingredients-table"></tbody>
  </table>
</section>

<section>
  <h2>Ricette — collega ingredienti ai piatti</h2>
  <form id="recipe-form" class="recipe-form">
    <div><label>Piatto</label><select id="recipe-menu-item" required></select></div>
    <div><label>Ingrediente</label><select id="recipe-ingredient" required></select></div>
    <div><label>Quantità (nella stessa unità dell'ingrediente)</label><input type="number" id="recipe-qty" step="0.1" min="0" required></div>
    <button type="submit">Aggiungi alla ricetta</button>
  </form>
</section>

<section>
  <h2>Food Cost per piatto</h2>
  <table>
    <thead><tr><th>Piatto</th><th>Prezzo</th><th>Costo materie prime</th><th>Food cost %</th></tr></thead>
    <tbody id="foodcost-table"></tbody>
  </table>
</section>

<script>
const BASE = "http://localhost:8000";
const statusEl = document.getElementById("status");
function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.style.color = isError ? "#b3261e" : "#555";
}

let menuItems = [];
let ingredients = [];

async function loadAll() {
  await Promise.all([loadIngredients(), loadMenuItems()]);
  await loadFoodCosts();
}

async function loadIngredients() {
  const res = await fetch(`${BASE}/ingredients`);
  ingredients = await res.json();
  const tbody = document.getElementById("ingredients-table");
  tbody.innerHTML = ingredients.map(i => `
    <tr><td>${i.name}</td><td>${i.unit}</td><td>€${i.cost_per_unit}</td><td>${i.supplier || ""}</td></tr>
  `).join("");

  const select = document.getElementById("recipe-ingredient");
  select.innerHTML = ingredients.map(i => `<option value="${i.id}">${i.name} (${i.unit})</option>`).join("");
}

async function loadMenuItems() {
  const res = await fetch(`${BASE}/menu`);
  menuItems = await res.json();
  const select = document.getElementById("recipe-menu-item");
  select.innerHTML = menuItems.map(m => `<option value="${m.id}">${m.name}</option>`).join("");
}

async function loadFoodCosts() {
  const tbody = document.getElementById("foodcost-table");
  tbody.innerHTML = "";
  for (const item of menuItems) {
    try {
      const res = await fetch(`${BASE}/food-cost/${item.id}`);
      const data = await res.json();
      const pct = data.food_cost_percentage;
      const cssClass = pct <= 28 ? "cost-good" : pct <= 35 ? "cost-warn" : "cost-bad";
      tbody.innerHTML += `
        <tr>
          <td>${data.menu_item_name}</td>
          <td>€${data.price.toFixed(2)}</td>
          <td>€${data.total_cost.toFixed(2)}</td>
          <td class="${cssClass}">${pct.toFixed(1)}%</td>
        </tr>`;
    } catch (e) { /* piatto senza ricetta, skip */ }
  }
}

document.getElementById("ingredient-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    name: document.getElementById("ing-name").value,
    unit: document.getElementById("ing-unit").value,
    cost_per_unit: parseFloat(document.getElementById("ing-cost").value),
    supplier: document.getElementById("ing-supplier").value || null,
  };
  try {
    const res = await fetch(`${BASE}/ingredients`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(await res.text());
    e.target.reset();
    setStatus("Ingrediente aggiunto.");
    await loadIngredients();
  } catch (err) {
    setStatus("Errore: " + err.message, true);
  }
});

document.getElementById("recipe-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    menu_item_id: parseInt(document.getElementById("recipe-menu-item").value),
    ingredient_id: parseInt(document.getElementById("recipe-ingredient").value),
    quantity: parseFloat(document.getElementById("recipe-qty").value),
  };
  try {
    const res = await fetch(`${BASE}/recipes`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById("recipe-qty").value = "";
    setStatus("Ingrediente aggiunto alla ricetta.");
    await loadFoodCosts();
  } catch (err) {
    setStatus("Errore: " + err.message, true);
  }
});

loadAll();
</script>
</body>
</html>
